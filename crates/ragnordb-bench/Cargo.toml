[package]
name = "ragnordb-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
criterion = "0.8"
ragnordb-common = { path = "../ragnordb-common" }
ragnordb-storage = { path = "../ragnordb-storage" }
ragnordb-tablet = { path = "../ragnordb-tablet" }
ragnordb-multiraft = { path = "../ragnordb-multiraft" }
wal = { workspace = true }

[[bench]]
name = "milestone4"
harness = false
