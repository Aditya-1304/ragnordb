# Main workspace that contains every ragnorDB crates under itself 
# it contains centralized versioning of all dependencies, package versions, editions, license, etc
[workspace]
resolver = "3"
members = [
    "crates/ragnordb-common",
    "crates/ragnordb-sql",
    "crates/ragnordb-catalog",
    "crates/ragnordb-txn",
    "crates/ragnordb-tablet",
    "crates/ragnordb-storage",
    "crates/ragnordb-exec",
    "crates/ragnordb-multiraft",
    "crates/ragnordb-server",
    "crates/ragnordb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Aditya-1304/ragnordb"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
prost-build = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tokio-util = "0.7"
toml = "0.8"
crc32c = "0.6"

raft = { path = "../Papers/raft" }
wal = { path = "../wal" }
bloom-bloom = { path = "../bloom-bloom" }
