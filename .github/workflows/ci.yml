name: Milestone 3 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RagnorDB
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ragnordb

      # Local path dependencies are pinned so the validation result identifies
      # the exact infrastructure revisions used by this database checkout.
      - name: Check out A-WAL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Aditya-1304/A-WAL
          ref: b037a5e2a49e536abe7ea001d897c268a44bc25ds
          path: wal

      - name: Check out Raft
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Aditya-1304/raft
          ref: e8e5801aebf997e7b722ba55e447baa8f2709ad8
          path: Papers/raft

      - name: Check out Bloom Bloom
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Aditya-1304/bloom-bloom
          ref: c200c74df6d4cfdd620f707c1201a6c244f023d4
          path: bloom-bloom

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Format
        working-directory: ragnordb
        run: cargo +1.97.1 fmt --all --check

      - name: Test all targets and features
        working-directory: ragnordb
        run: cargo +1.97.1 test --workspace --all-targets --all-features --locked

      - name: Clippy
        working-directory: ragnordb
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Documentation
        working-directory: ragnordb
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --workspace --all-features --no-deps --locked
