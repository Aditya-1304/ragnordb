syntax = "proto3";
package ragnordb.command;

import "ids.proto";
import "row.proto";
import "mvcc.proto";
import "catalog.proto";

//durable proposal payload for one tablet state machine command
//
// routing and retry metadata live inside the bytes commited by raft
// so replay performs the same epoch validation and request
// deduplication as live apply
message TabletCommandEnvelope {
    uint32 format_version = 1;
    ragnordb.ids.RequestId request_id = 2;
    ragnordb.ids.TabletId tablet_id = 3;
    uint64 expected_epoch = 4;
    TabletCommand command = 5;
    ragnordb.ids.LogicalCommandId logical_command_id = 6;

    // Durable retry-horizon watermark observed by the client when this
    // command was issued. The tablet may compact outcomes at or below this
    // watermark only after the watermark itself has entered the Raft log.
    optional uint64 acknowledged_through = 7;
}

// A bounded, deterministic group of already-routed mutation commands for one
// tablet. The individual envelopes remain complete so request identity,
// retry horizons, and tablet-generation validation survive batching.
message TabletCommandBatchEnvelope {
    uint32 format_version = 1;
    repeated TabletCommandEnvelope commands = 2;
}

message TabletCommand {
    oneof command {
        PrewriteCommand prewrite = 1;
        CommitCommand commit = 2;
        RollbackCommand rollback = 3;
        SingleShardCommitCommand single_shard_commit = 4;
        ResolveIntentCommand resolve_intent = 5;
        CatalogCommand catalog_update = 6;
        NoopCommand noop = 7;
        PublishAbortedTransactionStatus publish_aborted_transaction_status = 8;
        HeartbeatTransactionStatus heartbeat_transaction_status = 9;
        ExpirePendingTransactionStatus expire_pending_transaction_status = 10;
    }
}

message PrewriteCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    reserved 3, 4, 6, 8;
    bytes primary_key = 5;
    uint64 ttl_ms = 7;
    repeated WriteEntry writes = 9;
    // Present only on the primary participant. The state machine installs
    // this pending decision atomically with the primary intent batch.
    optional ragnordb.mvcc.TxnStatusRecord pending_status = 10;
}

message CommitCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    ragnordb.ids.Timestamp commit_timestamp = 3;
    reserved 4;
    repeated bytes keys = 5;
    // Present only on the primary participant. Publication is atomic with
    // committing the primary intent.
    optional ragnordb.mvcc.TxnStatusRecord committed_status = 6;
}

// Publish a terminal abort decision after the coordinator has applied rollback
// on every participant. This command changes status state only.
message PublishAbortedTransactionStatus {
    ragnordb.mvcc.TxnStatusRecord status_record = 1;
}

// Extend a pending lease only when the exact observed status is still current.
// The supplied wall-clock sample keeps replicated apply deterministic.
message HeartbeatTransactionStatus {
    ragnordb.mvcc.TxnStatusRecord expected_status = 1;
    ragnordb.mvcc.TxnStatusRecord next_status = 2;
    uint64 now_ms = 3;
}

// Commit an expiry decision only when the exact pending status observed by
// the cleaner is still current and its durable deadline has elapsed.
message ExpirePendingTransactionStatus {
    ragnordb.mvcc.TxnStatusRecord expected_status = 1;
    uint64 now_ms = 2;
}

message RollbackCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    reserved 3;
    repeated bytes keys = 4;
}

message SingleShardCommitCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    ragnordb.ids.Timestamp commit_timestamp = 3;
    repeated WriteEntry writes = 4;
}

message WriteEntry {
    bytes key = 1;

    // field 2 previously carried one Value instead of the complete row
    reserved 2;

    ragnordb.mvcc.WriteKind op = 3;

    // required for Put and absent for Delete
    ragnordb.row.Row row = 4;
}

message ResolveIntentCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    reserved 3;
    ragnordb.mvcc.TxnStatus resolved_status = 4;
    ragnordb.ids.Timestamp commit_timestamp = 5;
    repeated bytes keys = 6;
}

message CatalogCommand {
    oneof operation {
        CreateTableOperation create_table = 1;
    }
}

message CreateTableOperation {
    ragnordb.catalog.TableDefinition table_definition = 1;
}

message NoopCommand {
}

// replicated command metadata that must survive tablet snapshot installation
// entries are encoded in ascending client-ID order by the domain codec
message TabletStateMachineSnapshot {
    uint32 format_version = 1;
    ragnordb.ids.TabletId tablet_id = 2;
    uint64 tablet_epoch = 3;
    repeated ClientDeduplicationSnapshot clients = 4;
    ragnordb.ids.RaftGroupId raft_group_id = 5;
    repeated LogicalCommandDeduplicationSnapshot logical_commands = 6;
    repeated LogicalClientRetryHorizon logical_client_retry_horizons = 7;
    // Old snapshots omit this field and restore with no durable status entries.
    repeated ragnordb.mvcc.TxnStatusRecord transaction_statuses = 8;
}

// last applied request and cached result for one client in this Raft group
message ClientDeduplicationSnapshot {
    ragnordb.ids.RequestId last_request_id = 1;
    CachedTabletCommandResult cached_result = 2;
    CachedTabletCommandRejection cached_rejection = 3;
}

// V2 deduplication entries are keyed by logical command identity rather than
// by a group-qualified legacy RequestId. This is what makes a retry safe when
// metadata routes the same logical command to a different tablet generation.
message LogicalCommandDeduplicationSnapshot {
    ragnordb.ids.LogicalCommandId logical_command_id = 1;
    CachedTabletCommandResult cached_result = 2;
    CachedTabletCommandRejection cached_rejection = 3;
}

message LogicalClientRetryHorizon {
    bytes client_id = 1;
    uint64 session_epoch = 2;
    uint64 acknowledged_through = 3;
}

message CachedTabletCommandRejection {
    CachedTabletCommandRejectionKind kind = 1;
    string reason = 2;
}

enum CachedTabletCommandRejectionKind {
    CACHED_TABLET_COMMAND_REJECTION_KIND_UNSPECIFIED = 0;
    CACHED_TABLET_COMMAND_REJECTION_KIND_INVALID_COMMAND = 1;
    CACHED_TABLET_COMMAND_REJECTION_KIND_WRITE_CONFLICT = 2;
    CACHED_TABLET_COMMAND_REJECTION_KIND_UNSUPPORTED_COMMAND = 3;
}

// durable command results require explicit variants so a newer result cannot
// accidentally acquire old semantics during recovery
enum CachedTabletCommandResult {
    CACHED_TABLET_COMMAND_RESULT_UNSPECIFIED = 0;
    CACHED_TABLET_COMMAND_RESULT_NOOP = 1;
    CACHED_TABLET_COMMAND_RESULT_SINGLE_SHARD_COMMIT = 2;
    CACHED_TABLET_COMMAND_RESULT_PREWRITE = 3;
    CACHED_TABLET_COMMAND_RESULT_COMMIT = 4;
    CACHED_TABLET_COMMAND_RESULT_ROLLBACK = 5;
    CACHED_TABLET_COMMAND_RESULT_RESOLVE_INTENT = 6;
    CACHED_TABLET_COMMAND_RESULT_PUBLISH_ABORTED_TRANSACTION_STATUS = 7;
    CACHED_TABLET_COMMAND_RESULT_HEARTBEAT_TRANSACTION_STATUS = 8;
}
