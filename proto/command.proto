syntax = "proto3";
package ragnordb.command;

import "ids.proto";
import "row.proto";
import "mvcc.proto";
import "catalog.proto";

//durable proposal payload for one tablet state machine command
//
// routing and retry metadata live inside the bytes commited by raft
// so replay performs the same epoch validation and request
// deduplication as live apply
message TabletCommandEnvelope {
    uint32 format_version = 1;
    ragnordb.ids.RequestId request_id = 2;
    ragnordb.ids.TabletId tablet_id = 3;
    uint64 expected_epoch = 4;
    TabletCommand command = 5;
}

message TabletCommand {
    oneof command {
        PrewriteCommand prewrite = 1;
        CommitCommand commit = 2;
        RollbackCommand rollback = 3;
        SingleShardCommitCommand single_shard_commit = 4;
        ResolveIntentCommand resolve_intent = 5;
        CatalogCommand catalog_update = 6;
        NoopCommand noop = 7;
    }
}

message PrewriteCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    bytes key = 3;

    // field 4 previously carried one Value, which cannot represent a complete
    // multi-column SQL row. we will never reuse its durable field number
    reserved 4;

    bytes primary_key = 5;
    ragnordb.mvcc.WriteKind op = 6;
    uint64 ttl_ms = 7;

    // Required for Put and absent for Delete.
    ragnordb.row.Row row = 8;
}

message CommitCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    ragnordb.ids.Timestamp commit_timestamp = 3;
    bytes key = 4;
}

message RollbackCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    bytes key = 3;
}

message SingleShardCommitCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    ragnordb.ids.Timestamp commit_timestamp = 3;
    repeated WriteEntry writes = 4;
}

message WriteEntry {
    bytes key = 1;

    // field 2 previously carried one Value instead of the complete row
    reserved 2;

    ragnordb.mvcc.WriteKind op = 3;

    // required for Put and absent for Delete
    ragnordb.row.Row row = 4;
}

message ResolveIntentCommand {
    ragnordb.ids.TxnId txn_id = 1;
    ragnordb.ids.Timestamp start_timestamp = 2;
    bytes key = 3;
    ragnordb.mvcc.TxnStatus resolved_status = 4;
    ragnordb.ids.Timestamp commit_timestamp = 5;
}

message CatalogCommand {
    oneof operation {
        CreateTableOperation create_table = 1;
    }
}

message CreateTableOperation {
    ragnordb.catalog.TableDefinition table_definition = 1;
}

message NoopCommand {
}

// replicated command metadata that must survive tablet snapshot installation
// entries are encoded in ascending client-ID order by the domain codec
message TabletStateMachineSnapshot {
    uint32 format_version = 1;
    ragnordb.ids.TabletId tablet_id = 2;
    uint64 tablet_epoch = 3;
    repeated ClientDeduplicationSnapshot clients = 4;
}

// last applied request and cached result for one client in this Raft group
message ClientDeduplicationSnapshot {
    ragnordb.ids.RequestId last_request_id = 1;
    CachedTabletCommandResult cached_result = 2;
}

// durable command results require explicit variants so a newer result cannot
// accidentally acquire old semantics during recovery
enum CachedTabletCommandResult {
    CACHED_TABLET_COMMAND_RESULT_UNSPECIFIED = 0;
    CACHED_TABLET_COMMAND_RESULT_NOOP = 1;
    CACHED_TABLET_COMMAND_RESULT_SINGLE_SHARD_COMMIT = 2;
    CACHED_TABLET_COMMAND_RESULT_PREWRITE = 3;
}