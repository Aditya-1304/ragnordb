syntax = "proto3";

package ragnordb.wal;

import "ids.proto";
import "command.proto";

// Durable record for one transaction committed by the single node engine
//
// A-WAL provides record framing, checksums, ordering, and durability.
// this message contains the database state transition required for 
// deterministic MVCC reconstruction during startup recovery
message SingleNodeTxnCommit {
    // Version of this payload schema
    uint32 version = 1;

    // Table owned by the local tablet that accepted the mutation batch
    ragnordb.ids.TableId table_id = 2;

    // Stable identity of the transaction that produced this commit
    ragnordb.ids.TxnId txn_id = 3;

    // Snapshot timestamp used for transaction conflict validation
    ragnordb.ids.Timestamp start_timestamp = 4;

    // Timestamp at which the entire mutation batch became visible
    ragnordb.ids.Timestamp commit_timestamp = 5;

    // Complete transaction mutation batch in deterministic key order
    repeated WalWrite writes = 6;
}

// One encoded row mutation within a committed transaction batch
message WalWrite {
    // Canonical encoded row key, including the table namespace.
    bytes key = 1;

    oneof mutation {
        // Complete canonical encoded row for an insert or update.
        bytes put_row = 2;

        // Explicit row-deletion marker.
        DeleteMarker delete = 3;
    }
}

// Presence of this message represents a deletion
//
// An empty marker avoids boolean default-value ambiguity while keeping Put and
// Delete structurally exclusive through protobuf's `oneof`
message DeleteMarker {
}

// durable envelope for one catalog state transition
//
// the enclosed CatalogCommand is shared with the later replicated catalog path
// the envelope adds single node recovery metadata without creating a second
// representation for catalog operations
message CatalogUpdate {
    // Version of this payload schema
    uint32 version = 1;

    // Timestamp assigned to this catalog state transition
    ragnordb.ids.Timestamp update_timestamp = 2;

    // Table affected by the enclosed catalog operation
    ragnordb.ids.TableId table_id = 3;

    // Complete catalog operation applied during replay
    ragnordb.command.CatalogCommand command = 4;
}

// durable pointer to a database snapshot file
//
// the snapshot represents every relevant database WAL transition strictly before
// `replay_from_lsn` recovery loads the referenced snapshot and then replays WAL
// records starting at that logical position
message SnapshotPointer {
    // Version of this payload schema
    uint32 version = 1;

    // Stable, nonzero snapshot identity.
    uint64 snapshot_id = 2;

    // Highest MVCC timestamp represented by the snapshot.
    ragnordb.ids.Timestamp snapshot_timestamp = 3;

    // First logical WAL position not represented by the snapshot.
    //
    // LSN zero is valid and means that the snapshot does not permit skipping any
    // WAL history.
    uint64 replay_from_lsn = 4;

    // Portable path relative to the configured database snapshot directory.
    string relative_path = 5;

    // Deterministically ordered set of table states represented by the snapshot.
    repeated ragnordb.ids.TableId table_ids = 6;

    // exact size of the immutable snapshot file in bytes
    uint64 file_length = 7;

    // CRC32C of the complete snapshot file, including its fixed envelope
    uint32 file_checksum_crc32c = 8;

    // Snapshot-file envelope version expected by recovery
    uint32 snapshot_format_version = 9;
}

// durable publication marker for completed database snapshot
//
// the marker repeats the recovery critical identity, timestamp and replay 
// boundary from SnapshotPointer. checkpoint publication must verify that 
// these fields match the referenced pointer before the marker is appended
message CheckpointMarker {
    // version of this payload schema
    uint32 version = 1;

    // stable identity of the snapshot published by this checkpoint
    uint64 snapshot_id = 2;

    // highest MVCC timestamp represented by the published snapshot
    ragnordb.ids.Timestamp snapshot_timestamp = 3;

    // first logical WAL partition not represented by the snapshot
    //
    // LSN zero is valid and means recovery must replay from the beginning of 
    // the retainde WAL
    uint64 replay_from_lsn = 4;
}