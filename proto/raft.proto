syntax = "proto3";
package ragnordb.raft;

import "ids.proto";

message ReplicaPlacement {
    ragnordb.ids.ReplicaId replica_id = 1;
    ragnordb.ids.NodeId node_id = 2;
}

// Durable, exactly-once authority for the initial identity and membership of
// one Raft group.
message RaftGroupBootstrap {
    uint32 format_version = 1;
    string cluster_id = 2;
    ragnordb.ids.RaftGroupId raft_group_id = 3;
    uint64 configuration_epoch = 4;
    repeated ReplicaPlacement replica_placements = 5;
    repeated ragnordb.ids.ReplicaId initial_voters = 6;
    repeated ragnordb.ids.ReplicaId initial_learners = 7;
}

// durable V1 representation of one Raft log entry owned by one replica
// lifetime. group and replica identities are carried in every record so a
// shared WAL can never infer ownership from the log index alone
message RaftLogEntryRecord {
    uint32 format_version = 1;
    ragnordb.ids.RaftGroupId raft_group_id = 2;
    ragnordb.ids.ReplicaId replica_id = 3;
    uint64 index = 4;
    uint64 term = 5;

    oneof payload {
        bytes normal_command = 6;
        RaftConfigurationChange configuration_change = 7;
    }
}

// durable representation of the Raft core's validated configuration-change
// payload. configuration entries are never decoded as tablet commands
message RaftConfigurationChange {
    uint64 expected_version = 1;
    RaftConfigurationChangeKind kind = 2;
    ragnordb.ids.ReplicaId replica_id = 3;
}

enum RaftConfigurationChangeKind {
    RAFT_CONFIGURATION_CHANGE_KIND_UNSPECIFIED = 0;
    RAFT_CONFIGURATION_CHANGE_KIND_ADD_LEARNER = 1;
    RAFT_CONFIGURATION_CHANGE_KIND_PROMOTE_LEARNER = 2;
    RAFT_CONFIGURATION_CHANGE_KIND_REMOVE_REPLICA = 3;
}

// durable election and commit frontier for one replica lifetime. This record
// is appended after every entry and configuration record in its persistence
// batch so no recoverable prefix can reference missing log state
message RaftHardStateRecord {
    uint32 format_version = 1;
    ragnordb.ids.RaftGroupId raft_group_id = 2;
    ragnordb.ids.ReplicaId replica_id = 3;
    uint64 current_term = 4;
    ragnordb.ids.ReplicaId voted_for = 5;
    uint64 commit_index = 6;
}

// durable membership state associated with one replica lifetime. Repeated
// identities are encoded in ascending order by the domain codec
message RaftConfStateRecord {
    uint32 format_version = 1;
    ragnordb.ids.RaftGroupId raft_group_id = 2;
    ragnordb.ids.ReplicaId replica_id = 3;
    uint64 configuration_version = 4;
    repeated ragnordb.ids.ReplicaId voters = 5;
    repeated ragnordb.ids.ReplicaId learners = 6;
    repeated ragnordb.ids.ReplicaId outgoing_voters = 7;
}

// durable logical frontiers for one replica lifetime. The truncation boundary
// retains its term so the Raft core can validate AppendEntries immediately
// before the first retained log entry
message RaftProgressRecord {
    uint32 format_version = 1;
    ragnordb.ids.RaftGroupId raft_group_id = 2;
    ragnordb.ids.ReplicaId replica_id = 3;
    uint64 truncated_through_index = 4;
    uint64 truncated_through_term = 5;
    uint64 applied_index = 6;
}